<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Contas Pessoais</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contas">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
/* ---- tela de login ---- */
#loginScreen{position:fixed;inset:0;background:var(--head);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#loginBox{background:#fff;border-radius:22px;padding:28px 22px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#loginBox h1{margin:0 0 4px;font-size:22px}
#loginBox p{margin:0 0 20px;font-size:13.5px;color:var(--mut)}
.lseg{display:grid;grid-template-columns:1fr 1fr;background:#f1f5f9;border-radius:12px;padding:3px;gap:3px;margin-bottom:18px}
.lseg button{padding:9px;border-radius:9px;font-weight:600;color:var(--mut);font-size:14px}
.lseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lerr{color:var(--red);font-size:13px;min-height:18px;margin:-8px 0 10px}
#loginScreen .btn{margin-top:4px}
</style>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
  --red:#dc2626; --redbg:#fef2f2; --grn:#059669; --grnbg:#ecfdf5; --blu:#2563eb; --amb:#b45309; --ambbg:#fffbeb;
  --head:#0f172a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

header{background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 18px;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.htitle{font-weight:700;font-size:17px}
.status{font-size:11.5px;opacity:.75;margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;font-size:20px}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.monthnav .iconbtn{font-size:22px}
.mlabel{font-weight:600;font-size:16px;text-transform:capitalize;text-align:center}
.mlabel small{display:block;font-weight:400;font-size:11px;opacity:.7;text-transform:none}

main{padding:14px 14px 0;max-width:640px;margin:0 auto}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.box .lb{font-size:12px;color:var(--mut)}
.box .vl{font-size:19px;font-weight:700;margin-top:2px;white-space:nowrap}
.box .sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.box.saldo{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.box.saldo .vl{font-size:22px}
.box.divida{grid-column:1/-1}
.box.divida .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.box.divida .bar i{background:var(--grn)}
.tag.parc{background:#eff6ff;color:var(--blu)}
.ival small{display:block;font-size:11px;font-weight:600;color:var(--mut)}
.paylist{margin:8px 0 0;font-size:13px;color:var(--mut)}
.paylist div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.in{color:var(--grn)} .out{color:var(--red)}

.alert{margin-top:10px;background:var(--ambbg);color:var(--amb);border:1px solid #fde68a;border-radius:14px;padding:10px 14px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.alert b{font-weight:700}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--mut)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.daylabel{font-size:12px;color:var(--mut);font-weight:600;margin:10px 4px 0}
.daylabel::first-letter{text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(15,23,42,.05);border-left:4px solid transparent}
.item.saida{border-left-color:var(--red)} .item.entrada{border-left-color:var(--grn)}
.item.pago{opacity:.6}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;font-size:15px;color:#fff}
.item.pago .chk{background:var(--grn);border-color:var(--grn)}
.ibody{flex:1;min-width:0;text-align:left}
.idesc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.pago .idesc{text-decoration:line-through}
.imeta{font-size:12px;color:var(--mut);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:1px 7px;border-radius:6px;background:#f1f5f9;font-size:11px;font-weight:600}
.tag.late{background:var(--redbg);color:var(--red)}
.ival{font-weight:700;text-align:right;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}

.grp{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.05);text-align:left;width:100%}
.grp .top{display:flex;justify-content:space-between;gap:10px}
.bar{height:6px;background:#e2e8f0;border-radius:4px;margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn);border-radius:4px}
.grp.saida .bar i{background:var(--blu)}
.sect{font-size:13px;font-weight:700;color:var(--mut);margin:16px 4px 2px;text-transform:uppercase;letter-spacing:.04em}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--ink);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--blu);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(37,99,235,.4);z-index:7;display:grid;place-items:center}

.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:#cbd5e1;margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{width:34px;height:34px;border-radius:10px;background:#f1f5f9;font-size:18px;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1f5f9;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{padding:10px;border-radius:9px;font-weight:600;color:var(--mut);font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.tipo button.on.s{color:var(--red)} .seg.tipo button.on.e{color:var(--grn)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
.inp{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--blu);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:46px;height:46px;font-size:22px;background:#f8fafc}
.stepper input{flex:1;border:0;text-align:center;font-size:16px;font-weight:700;width:40px;outline:none;padding:0}
.preview{background:#f8fafc;border-radius:12px;padding:10px 13px;font-size:13.5px;color:var(--mut);margin-bottom:14px}
.preview b{color:var(--ink)}
.checkrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px}
.checkrow input{width:22px;height:22px}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:15.5px;background:var(--ink);color:#fff}
.btn.blue{background:var(--blu)} .btn.green{background:var(--grn)}
.btn.ghost{background:#f1f5f9;color:var(--ink)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btns{display:grid;gap:8px;margin-top:10px}
.btns.two{grid-template-columns:1fr 1fr}
.err{color:var(--red);font-size:13px;margin:-6px 0 10px;min-height:0}

.pcard{border-radius:16px;padding:14px;background:#f8fafc;margin-bottom:12px}
.pcard .k{font-size:12.5px;color:var(--mut)}
.pcard .v{font-size:26px;font-weight:800;margin:2px 0}
.plist{margin-top:14px;border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:14px}
.prow.sel{background:#eff6ff}
.prow .n{width:44px;color:var(--mut);font-size:12.5px}
.prow .d{flex:1}
.prow .s{width:22px;text-align:center}
.small{font-size:12.5px;color:var(--mut)}
details.ed{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.acts{display:flex;gap:6px;margin-top:14px}
.acts button{flex:1;padding:12px 4px;border-radius:12px;font-size:13.5px;font-weight:700;white-space:nowrap}
.acts .ok{background:#f1f5f9;color:var(--ink)}
.acts .del{background:var(--redbg);color:var(--red)}
.edtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.edtabs button{padding:11px 4px;border-radius:12px;background:#f1f5f9;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.edtabs button.on{background:var(--ink);color:#fff}
details.ed.pick{border:0;padding:0;margin-top:10px}
details.ed.pick summary{display:none}
details.ed.pick:not([open]){margin:0;height:0;overflow:hidden}
.acts{margin-top:8px}
.rep{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.05);margin-top:10px}
.rep h3{margin:0 0 10px;font-size:15px}
.rgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;color:var(--mut)}
.rgrid b{display:block;font-size:14.5px;color:var(--ink);margin-top:2px}
.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.rtab td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rtab td.r,.rtab th.r{text-align:right;white-space:nowrap}
.rtab tr.tot td{font-weight:700;border-bottom:0}
.rnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.rnav button.ar{width:42px;height:42px;border-radius:12px;background:var(--card);font-size:20px;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.rnav .t{font-weight:700;font-size:16px;text-transform:capitalize}
.ractions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ractions button{padding:13px 6px;border-radius:14px;font-weight:700;font-size:14px;background:var(--ink);color:#fff}
.ractions button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.printhead{display:none}
@media print{
  body{background:#fff;padding:0}
  header,nav.tabs,.fab,.noprint,.toast,.ov{display:none!important}
  main{max-width:none;padding:0}
  .rep,.box{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .printhead{display:block;font-size:20px;font-weight:800;margin-bottom:4px}
}
details.ed summary{padding:10px 0;font-weight:600;font-size:14px;cursor:pointer}
textarea.inp{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- tela de login (escondida depois do login) -->
<div id="loginScreen">
  <div id="loginBox">
    <h1>💰 Contas Pessoais</h1>
    <div class="lseg">
      <button id="lTabLogin" class="on" onclick="lTab('login')">Entrar</button>
      <button id="lTabReg" onclick="lTab('reg')">Criar conta</button>
    </div>
    <label class="f"><span>Nome de usuário</span><input class="inp" id="lNome" placeholder="Seu nome" autocomplete="username" autocapitalize="words" maxlength="40"></label>
    <label class="f"><span>Senha</span><input class="inp" id="lSenha" type="password" placeholder="••••••" autocomplete="current-password" maxlength="60"></label>
    <div class="lerr" id="lErr"></div>
    <button class="btn blue" id="lBtn" onclick="lSubmit()">Entrar</button>
  </div>
</div>

<header>
  <div class="hrow">
    <div>
      <div class="htitle">Contas Pessoais</div>
      <div class="status" id="status">Carregando…</div>
    </div>
    <div style="display:flex;gap:8px"><button class="iconbtn" id="btnEye" aria-label="Esconder valores"></button><button class="iconbtn" id="btnUser" title="Usuário / Sair" style="font-size:14px;font-weight:700" aria-label="Usuário">👤</button><button class="iconbtn" id="btnMenu" aria-label="Backup e opções">⋯</button></div>
  </div>
  <div class="monthnav" id="monthnav">
    <button class="iconbtn" id="prevM" aria-label="Mês anterior">‹</button>
    <button class="mlabel" id="mlabel" style="color:#fff"></button>
    <button class="iconbtn" id="nextM" aria-label="Próximo mês">›</button>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fab" aria-label="Novo lançamento">+</button>
<nav class="tabs">
  <button id="tabMes" class="on"><span>📅</span>Mês</button>
  <button id="tabParc"><span>🧾</span>Parcelamentos</button>
  <button id="tabRel"><span>📊</span>Relatório</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmt = c => state.oculto ? 'R$ ••••' : (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const ymOf = s => s.slice(0,7);
const brDate = s => s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const shortDate = s => s.slice(8,10)+'/'+s.slice(5,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pn = (g,i) => g.parcelas[i].n || i+1;
const pt = g => g.tot || g.parcelas.length;
const pagoV = p => p.pago ? p.v : Math.min(p.pg||0, p.v);   // quanto já foi pago da parcela
const falta = p => p.v - pagoV(p);                            // quanto ainda falta
const reais = c => (c/100).toFixed(2).replace('.',',');
const uid = () => 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function addMonths(s,k){
  let y=+s.slice(0,4), m=+s.slice(5,7)-1+k, d=+s.slice(8,10);
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  const last=new Date(y,m+1,0).getDate();
  return y+'-'+String(m+1).padStart(2,'0')+'-'+String(Math.min(d,last)).padStart(2,'0');
}
function shiftYm(ym,k){ return addMonths(ym+'-01',k).slice(0,7); }
function ymLabel(ym){ return MESES[+ym.slice(5,7)-1]+' '+ym.slice(0,4); }
function parseMoney(str){
  let s=String(str||'').replace(/[R$\s]/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=Number(s); return isFinite(n)?Math.round(n*100):NaN;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- estado ---------- */
const API = '';   // mesmo origin — Worker serve o index.html
const LS_TOKEN = 'cp-token';
const LS_NOME  = 'cp-nome';
const state = { g:{}, ym: todayStr().slice(0,7), filtro:'todas', tab:'mes', quitados:false, atrasadas:false };
let authToken = '', authNome = '';
try{ authToken = localStorage.getItem(LS_TOKEN)||''; authNome = localStorage.getItem(LS_NOME)||''; }catch(e){}

function setStatus(msg){ const el=document.getElementById('status'); if(el) el.textContent=msg; }

/* ---------- API helpers ---------- */
async function apiFetch(path, options={}){
  const res = await fetch(API + path, {
    ...options,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+authToken, ...(options.headers||{}) }
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Erro '+res.status);
  return data;
}

async function carregarDados(){
  setStatus('⏳ Carregando…');
  try{
    const g = await apiFetch('/api/lancamentos');
    state.g = g || {};
    setStatus('☁️ Salvo na nuvem · '+authNome);
    render();
  }catch(e){
    setStatus('⚠️ Sem conexão — '+e.message);
  }
}

/* persist: envia um lançamento para a API */
const queue={};
function persist(id, silent){
  if(!silent) render();
  const run = async()=>{
    try{
      const data = state.g[id] || null;
      await apiFetch('/api/lancamentos', { method:'POST', body: JSON.stringify({id, data}) });
      setStatus('☁️ Salvo · '+authNome);
    }catch(e){
      setStatus('⚠️ Não salvou: '+e.message);
    }
  };
  queue[id]=(queue[id]||Promise.resolve()).then(run);
}

/* ---------- login / registro ---------- */
let lModo = 'login';
function lTab(m){ lModo=m; $('#lTabLogin').classList.toggle('on',m==='login'); $('#lTabReg').classList.toggle('on',m==='reg'); $('#lBtn').textContent=m==='login'?'Entrar':'Criar conta'; $('#lErr').textContent=''; }
async function lSubmit(){
  const nome=($('#lNome').value||'').trim(), senha=($('#lSenha').value||'').trim();
  if(!nome||!senha){ $('#lErr').textContent='Preencha nome e senha.'; return; }
  $('#lBtn').disabled=true; $('#lErr').textContent='';
  try{
    const path = lModo==='login' ? '/api/auth/login' : '/api/auth/registro';
    const res = await fetch(API+path,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nome,senha}) });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ $('#lErr').textContent=data.error||'Erro ao entrar.'; return; }
    authToken=data.token; authNome=data.nome;
    try{ localStorage.setItem(LS_TOKEN,authToken); localStorage.setItem(LS_NOME,authNome); }catch(e){}
    $('#loginScreen').style.display='none';
    document.getElementById('btnUser').title = 'Olá, '+authNome+' · Sair';
    await carregarDados();
  }catch(e){ $('#lErr').textContent='Sem conexão. Verifique sua internet.';
  }finally{ $('#lBtn').disabled=false; }
}
$('#lNome').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#lSenha').focus(); });

function baixarArquivo(conteudo,nome,tipo){
  const blob=new Blob([conteudo],{type:tipo});
  try{
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); return true;
  }catch(e){ return false; }
}
function baixarCsv(its){

  const nome='relatorio-contas-'+(state.rel.modo==='mes'?state.rel.ym:'todos')+'.csv';
  if(baixarArquivo('\ufeff'+linhas.join('\r\n'),nome,'text/csv;charset=utf-8')) toast('Planilha baixada: '+nome); else toast('Não foi possível baixar aqui');
}

/* Recalcula as parcelas em aberto: nova quantidade total e/ou novo valor. Pagas ficam intactas. */
function planoParcelas(g,modo,val,T){
  const ps=JSON.parse(JSON.stringify(g.parcelas)), nt=pt(g), faltando=Math.max(0,nt-ps.length);
  if(!(T>=1&&T<=360)) return {err:'Quantidade de parcelas inválida.'};
  const L=T-faltando;
  let trav=ps.length; while(trav>0 && !ps[trav-1].pago && !((ps[trav-1].pg||0)>0)) trav--;
  if(L<Math.max(trav,1)) return {err:`Dá para reduzir no mínimo até ${Math.max(trav,1)+faltando} parcelas, porque as outras já têm pagamento.`};
  while(ps.length>L) ps.pop();
  while(ps.length<L){ const last=ps[ps.length-1]; ps.push({v:last.v,d:addMonths(last.d,1),pago:false,pagoEm:null,...(last.n?{n:last.n+1}:{})}); }
  const pend=ps.filter(x=>!x.pago);
  if(val!==null){
    if(!(val>0)) return {err:'Informe um valor maior que zero.'};
    if(!pend.length) return {err:'Não há parcelas em aberto para mudar o valor.'};
    if(modo==='parc') pend.forEach(x=>x.v=val);
    else { const vs=splitVals(val+pend.reduce((s,x)=>s+(x.pg||0),0),pend.length,'total'); pend.forEach((x,k)=>x.v=vs[k]); }
    pend.forEach(x=>{ if((x.pg||0)>=x.v){ x.pago=true; x.pagoEm=todayStr(); } });
  }
  return {ps, tot:(g.tot||faltando>0)?T:null, pend:ps.filter(x=>!x.pago)};
}
function splitVals(v,n,modo){
  if(modo==='parcela') return Array(n).fill(v);
  const base=Math.floor(v/n), rem=v-base*n;
  return Array.from({length:n},(_,i)=>base+(i===0?rem:0));
}

const LB='contas-ultimo-backup';
function ultimoBackup(){ try{ return localStorage.getItem(LB)||''; }catch(e){ return ''; } }
function marcarBackup(){ try{ localStorage.setItem(LB,todayStr()); }catch(e){} }
function diasDesde(d){ return Math.round((new Date(todayStr()+'T12:00')-new Date(d+'T12:00'))/86400000); }

function salvarArquivo(){
  const nome='contas-pessoais-backup-'+todayStr()+'.json';
  if(baixarArquivo(textoBackup(),nome,'application/json')){ marcarBackup(); toast('Backup baixado: '+nome); openMenu(); }

}

  const txt=textoBackup();
  try{ await navigator.clipboard.writeText(txt); marcarBackup(); toast('Backup copiado — cole numa nota ou no WhatsApp'); }
  catch(e){ const t=$('#mTxt'); if(t){ t.value=txt; t.closest('details').open=true; t.select(); } toast('Selecione o texto e copie'); }

    <div class="btns">
      <button class="btn" id="btnInstall" onclick="instalarApp()" style="background:#2563eb;display:none">📲 Instalar app no celular</button>
      <button class="btn green" id="mSave">📥 Baixar backup</button>
    </div>
    <p class="small"><b>Trocar de celular ou não perder nada:</b> o arquivo vai para <b>Downloads</b> (no iPhone: app Arquivos → Downloads). Guarde uma cópia no iCloud Drive / Arquivos, no Google Drive ou mande para você mesmo no WhatsApp ou e-mail. No celular novo, abra o app, toque em <b>⋯</b> e em <b>Restaurar backup</b>.</p>
    <div class="sect" style="margin-top:18px">Restaurar</div>
    <div class="btns">
      <label class="btn" style="text-align:center;display:block">📂 Restaurar backup (arquivo .json)<input type="file" id="mFile" accept=".json,application/json,text/plain" style="display:none"></label>
    </div>
    <p class="small">Aceita backups deste app e do Simples Mais Money. Restaurar não apaga o que já existe: lançamentos iguais são atualizados, sem duplicar.</p>
  `,{type:'menu'});
  $('#mx').onclick=closeSheet;
  if(deferredInstall) { const b=$('#btnInstall'); if(b) b.style.display=''; }
  $('#mSave').onclick=salvarArquivo;
  $('#mFile').onchange=async e=>{ const f=e.target.files[0]; if(f) importar(await f.text()); };
}
/* Converte o backup do app Simples Mais Money (tabelas receita/despesa) */
function fromSMM(d){
  const I=d.data.inserts||{}, out={}, hoje=todayStr();
  const conv=(rows,tipo)=>{
    const groups={};
    (rows||[]).forEach(r=>{ if(!r||!(Number(r.valor)>0)||!/^\d{4}-\d{2}-\d{2}/.test(r.data||'')) return;
      const k=r.origem?String(r.origem):'u'+r.ID; (groups[k]=groups[k]||[]).push(r); });
    for(const [k,rs] of Object.entries(groups)){
      const cnt={}; rs.forEach(r=>{ const s=String(r.descricao||'').trim(); cnt[s]=(cnt[s]||0)+1; });
      const main=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
      const parc=r=>{ const d=r.data.slice(0,10), pago=tipo==='entrada'?d<=hoje:!!r.pago;
        return {v:Math.round(Number(r.valor)*100),d,pago,pagoEm:pago?d:null,...(r.parcelado&&r.nrparcela>0?{n:r.nrparcela}:{})}; };
      const grp=rs.filter(r=>String(r.descricao||'').trim()===main).sort((a,b)=>a.data.localeCompare(b.data)||(a.nrparcela||0)-(b.nrparcela||0));
      const tot=grp[0].parcelado&&grp[0].parcelas>1?grp[0].parcelas:0;
      out['smm'+tipo[0]+k]={tipo,desc:main||'Sem descrição',obs:'',criado:new Date().toISOString(),...(tot?{tot}:{}),parcelas:grp.map(r=>{const p=parc(r); if(!tot) delete p.n; return p;})};
      rs.filter(r=>String(r.descricao||'').trim()!==main).forEach(r=>{ const p=parc(r); delete p.n;
        out['smm'+tipo[0]+k+'-'+r.ID]={tipo,desc:String(r.descricao||'').trim()||'Sem descrição',obs:'',criado:new Date().toISOString(),parcelas:[p]}; });
    }
  };
  conv(I.despesa,'saida'); conv(I.receita,'entrada');
  return out;
}
async function importar(txt){
  let data;
  try{ data=JSON.parse(txt); }catch(e){ toast('Arquivo ou texto inválido'); return; }
  let lanc=data&&data.lancamentos&&typeof data.lancamentos==='object'?data.lancamentos:null, origem='';
  if(!lanc && data&&data.data&&data.data.inserts){ lanc=fromSMM(data); origem=' do Simples Mais Money'; }
  if(!lanc){ toast('Este não é um backup reconhecido'); return; }
  const ids=Object.keys(lanc).filter(k=>/^[A-Za-z0-9_-]+$/.test(k)&&lanc[k]&&Array.isArray(lanc[k].parcelas));
  if(!await confirmBox(`Importar ${ids.length} lançamento(s)${origem} (${ids.reduce((s,k)=>s+lanc[k].parcelas.length,0)} parcelas)? Se você já importou este backup antes, os mesmos lançamentos são atualizados, sem duplicar.`,'Importar',false)) return;
  ids.forEach(k=>{ const g=lanc[k];
    state.g[k]={tipo:g.tipo==='entrada'?'entrada':'saida',desc:String(g.desc||'Sem descrição').slice(0,80),obs:String(g.obs||'').slice(0,140),criado:g.criado||new Date().toISOString(),...(g.tot>1?{tot:Math.round(g.tot)}:{}),
      parcelas:g.parcelas.filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(p.d)&&isFinite(p.v)).map(p=>({v:Math.round(p.v),d:p.d,pago:!!p.pago,pagoEm:p.pagoEm||null,...(p.n>0?{n:Math.round(p.n)}:{}),...(p.pg>0?{pg:Math.round(p.pg)}:{}),...(Array.isArray(p.abat)?{abat:p.abat.filter(a=>a&&isFinite(a.v)&&/^\d{4}-\d{2}-\d{2}$/.test(a.d)).map(a=>({v:Math.round(a.v),d:a.d}))}:{})}))};
    persist(k,true);
  });
  render(); toast('Backup importado');
}

})();
